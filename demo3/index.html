<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhythm Particle Wave - Native JS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              glass: "rgba(255, 255, 255, 0.1)",
              glassBorder: "rgba(255, 255, 255, 0.2)",
            },
          },
        },
      }
    </script>

    <style>
      body { margin: 0; overflow: hidden; background-color: #050505; color: white; }
      #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
      #ui-layer { position: relative; z-index: 10; pointer-events: none; }
      .interactive { pointer-events: auto; }
    </style>

    <!-- Import Three.js via Module -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://aistudiocdn.com/three@^0.181.2"
      }
    }
    </script>
</head>
<body>

    <!-- 1. The Background Visualizer Container -->
    <div id="canvas-container"></div>

    <!-- 2. UI Layer (Your Website Content) -->
    <div id="ui-layer" class="w-full h-screen flex flex-col items-center justify-center">
        
        <!-- Title -->
        <h1 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white via-cyan-300 to-blue-500 drop-shadow-[0_0_30px_rgba(0,255,255,0.3)] mb-8 tracking-tighter text-center">
            BACKGROUND
        </h1>

        <!-- 
            3. YOUR AUDIO PLAYER 
            id="music-player" is used by the script to hook into the audio.
            crossOrigin="anonymous" is required for CORS if loading external MP3s.
        -->
        <div class="interactive bg-white/5 backdrop-blur-md p-6 rounded-2xl border border-white/10 shadow-2xl transition-all hover:bg-white/10">
          <p class="text-sm text-cyan-400 font-bold tracking-widest uppercase mb-4 text-center">
            Music Player
          </p>
          <audio 
            id="music-player"
            controls 
            loop
            crossOrigin="anonymous"
            class="w-80 h-10 accent-cyan-500"
            src="http://119.29.240.233/assets/audio/aicuo.mp3"
          ></audio>
        </div>
        
        <p class="mt-4 text-gray-500 text-xs">
            Play music to activate the particle wave
        </p>
    </div>

    <!-- Main Logic Script -->
    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const SEPARATION = 40;
        const AMOUNTX = 80;
        const AMOUNTY = 80;
        
        // --- State ---
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let isPlaying = false;
        let count = 0;

        // --- DOM Elements ---
        const container = document.getElementById('canvas-container');
        const audioEl = document.getElementById('music-player');

        // --- Three.js Variables ---
        let scene, camera, renderer;
        let particles;
        let fadeScene, fadeCamera, fadePlane;

        // ==========================================
        // 1. Audio System Setup
        // ==========================================
        function initAudio() {
            if (audioContext) return; // Already initialized

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();
            
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.85;

            // Connect HTML <audio> to Web Audio API
            const source = audioContext.createMediaElementSource(audioEl);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        audioEl.addEventListener('play', () => {
            initAudio();
            // Resume context if suspended (browser autoplay policy)
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            isPlaying = true;
        });

        audioEl.addEventListener('pause', () => {
            isPlaying = false;
        });

        // ==========================================
        // 2. Visualizer System Setup (Three.js)
        // ==========================================
        function initVisualizer() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(75, width / height, 1, 10000);
            camera.position.z = 1800;
            camera.position.y = 600;
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: false, 
                preserveDrawingBuffer: true // Crucial for trails
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(width, height);
            renderer.autoClear = false;
            renderer.setClearColor(0x000000, 1);
            container.appendChild(renderer.domElement);

            // --- Fade Effect (Trails) ---
            fadeScene = new THREE.Scene();
            fadeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const fadeGeometry = new THREE.PlaneGeometry(2, 2);
            const fadeMaterial = new THREE.MeshBasicMaterial({
                color: 0x000000,
                transparent: true,
                opacity: 0.15, // Trail length
                depthTest: false,
                depthWrite: false
            });
            fadePlane = new THREE.Mesh(fadeGeometry, fadeMaterial);
            fadeScene.add(fadePlane);

            // --- Particles ---
            const numParticles = AMOUNTX * AMOUNTY;
            const positions = new Float32Array(numParticles * 3);
            const scales = new Float32Array(numParticles);
            
            let i = 0, j = 0;
            for (let ix = 0; ix < AMOUNTX; ix++) {
                for (let iy = 0; iy < AMOUNTY; iy++) {
                    positions[i] = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2);
                    positions[i + 1] = 0;
                    positions[i + 2] = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2);
                    scales[j] = 1;
                    i += 3;
                    j++;
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

            // Custom Shader
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0x00ffff) },
                    pixelRatio: { value: window.devicePixelRatio },
                },
                vertexShader: `
                    attribute float scale;
                    uniform float pixelRatio;
                    varying float vScale;
                    
                    void main() {
                        vScale = scale;
                        vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
                        // Physical size attenuation
                        gl_PointSize = scale * 8.0 * pixelRatio * ( 600.0 / - mvPosition.z );
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 color;
                    varying float vScale;
                    
                    void main() {
                        // Distance from center (0.0 to 0.5)
                        float dist = distance(gl_PointCoord, vec2(0.5));
                        
                        // Exponential falloff for "hot light" look
                        float intensity = 1.0 - (pow(dist * 2.0, 1.5));
                        intensity = clamp(intensity, 0.0, 1.0);
                        
                        if (intensity <= 0.0) discard;

                        // Dynamic coloring: White center for large particles
                        vec3 finalColor = color;
                        if (vScale > 3.0) {
                            finalColor = mix(color, vec3(1.0, 1.0, 1.0), (vScale - 3.0) * 0.2);
                        }

                        gl_FragColor = vec4( finalColor, intensity );
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Start Loop
            animate();
        }

        // ==========================================
        // 3. Animation Loop
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Get Frequency Data
            if (analyser && isPlaying) {
                analyser.getByteFrequencyData(dataArray);
            }

            const positions = particles.geometry.attributes.position.array;
            const scales = particles.geometry.attributes.scale.array;

            // Calculate average volume for color brightness
            let sum = 0;
            if (analyser && isPlaying) {
                for(let k=0; k < dataArray.length; k++) sum += dataArray[k];
            }
            const avgVolume = isPlaying ? sum / dataArray.length : 0;

            let i = 0, j = 0;
            for (let ix = 0; ix < AMOUNTX; ix++) {
                for (let iy = 0; iy < AMOUNTY; iy++) {
                    
                    // 1. Base Idle Wave
                    const sineHeight = (Math.sin((ix + count) * 0.3) * 30) + (Math.sin((iy + count) * 0.5) * 30);
                    
                    let audioHeight = 0;
                    let scaleFactor = 0.5; // Base size
                    
                    // 2. Audio Reaction
                    if (analyser && isPlaying) {
                        const centerX = AMOUNTX / 2;
                        const centerY = AMOUNTY / 2;
                        const dist = Math.sqrt(Math.pow(ix - centerX, 2) + Math.pow(iy - centerY, 2));
                        const maxDist = Math.sqrt(Math.pow(centerX, 2) + Math.pow(centerY, 2));
                        
                        // Map particle position to frequency index
                        const normDist = dist / maxDist;
                        const freqIndex = Math.floor(normDist * (dataArray.length / 2)); 
                        const val = dataArray[freqIndex] || 0;
                        
                        audioHeight = val * 2.5; 
                        
                        // Bass/Hit reaction size
                        scaleFactor = 0.5 + Math.pow((val / 255.0), 2.5) * 5.0;
                    }

                    positions[i + 1] = sineHeight + audioHeight;
                    scales[j] = scaleFactor;

                    i += 3;
                    j++;
                }
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.scale.needsUpdate = true;

            // Color Cycling
            const hue = (count * 0.005) % 1;
            const targetColor = new THREE.Color();
            targetColor.setHSL(hue, 0.9, 0.5 + (avgVolume / 255) * 0.2); 
            particles.material.uniforms.color.value.lerp(targetColor, 0.1);

            count += 0.1;

            // Render with Trails
            renderer.render(fadeScene, fadeCamera);
            renderer.clearDepth(); // Keep particles on top of fade plane
            renderer.render(scene, camera);
        }

        // ==========================================
        // 4. Resize Handling
        // ==========================================
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                particles.material.uniforms.pixelRatio.value = window.devicePixelRatio;
            }
        });

        // Start
        initVisualizer();

    </script>
</body>
</html>
