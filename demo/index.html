<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radaville Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        radaville: {
                            brown: '#5C4033',     // Hagi's Oldtown
                            terracotta: '#A04930', // Hagi's Downtown
                            maroon: '#421216',    // Casa Paz
                            cream: '#F2E8DC',
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 12s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #F2E8DC;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: 'Inter', sans-serif;
        }
        
        /* Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Performance Optimizations */
        #app, #background, #header, #footer, #slides-container {
            will-change: transform, opacity;
        }
        
        /* Smooth Transitions */
        #background {
            transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        
        /* Enhanced Depth and Lighting */
        #slides-container {
            transform-style: preserve-3d;
        }
        
        /* Slide Enhancements */
        .slide-image {
            filter: saturate(1.1) contrast(1.05);
        }
        
        /* Text Enhancements */
        .text-shadow {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        /* Button Hover Effects */
        button, a {
            transition: all 0.3s ease;
        }
        
        button:hover, a:hover {
            transform: translateY(-1px);
        }
        
        /* Logo Animation Enhancement */
        .group:hover .logo-svg {
            transform: rotate(180deg) scale(1.1);
        }
        
        .logo-svg {
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Grid Lines Enhancement */
        #grid-lines {
            opacity: 0.7;
        }
        
        /* Mobile Optimizations */
        @media (max-width: 768px) {
            #header {
                padding: 4px 6px;
            }
            
            #footer {
                padding-bottom: 4px;
            }
            
            .slide-content {
                scale: 0.95;
            }
        }
        
        /* Loading States */
        img {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        img.loaded {
            opacity: 1;
        }
        
        /* Enhanced Overlay Effects */
        .slide-overlay {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.3) 100%);
        }
    </style>
</head>
<body>
    <div id="app" class="fixed inset-0 w-full h-full font-sans selection:bg-white/30 overflow-hidden">
        <!-- GLOBAL BACKGROUND - Fixed, Color Transitions -->
        <div id="background" class="absolute inset-0 transition-colors duration-100 ease-linear"></div>

        <!-- Global Grain -->
        <div class="fixed inset-0 pointer-events-none z-[100] opacity-[0.06] mix-blend-overlay" style="backgroundImage: url('data:image/svg+xml,%3Csvg viewBox=%270 0 200 200%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27noiseFilter%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.65%27 numOctaves=%273%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23noiseFilter)%27/%3E%3C/svg%3E')"></div>

        <!-- Header -->
        <header id="header" class="fixed top-0 left-0 w-full z-50 px-6 md:px-12 py-8 flex justify-between items-start font-mono text-xs md:text-xs tracking-widest text-[#F2E8DC] mix-blend-difference pointer-events-none">
            <div class="flex items-start gap-12 w-1/3 pointer-events-auto">
                <div class="flex flex-col gap-1 w-12">
                    <span id="progress" class="opacity-60">[ 00 ]</span>
                </div>
                
                <div class="flex flex-col gap-1">
                    <span id="slide-counter" class="opacity-90">1 &mdash; 3</span>
                    <span id="current-title" class="font-serif italic text-sm opacity-80 mt-2 capitalize whitespace-nowrap">
                        Hagi's Oldtown
                    </span>
                </div>
            </div>

            <div class="flex-1 flex justify-center -mt-2 pointer-events-auto">
                <!-- Logo -->
                <div class="flex flex-col items-center group cursor-pointer">
                    <div class="relative w-8 h-12">
                        <svg viewBox="0 0 24 40" fill="none" class="w-full h-full text-white logo-svg">
                            <path d="M12 2L22 10V30L12 38L2 30V10L12 2Z" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M12 8L17 12V28L12 32L7 28V12L12 8Z" fill="currentColor" class="opacity-90"/>
                            <path d="M12 2V8" stroke="currentColor" stroke-width="1"/>
                            <path d="M12 32V38" stroke="currentColor" stroke-width="1"/>
                            <path d="M2 10L7 12" stroke="currentColor" stroke-width="1"/>
                            <path d="M22 10L17 12" stroke="currentColor" stroke-width="1"/>
                        </svg>
                    </div>
                    <div class="mt-3 flex flex-col items-center gap-0.5">
                        <span class="text-[9px] tracking-[0.25em] uppercase opacity-90">Radaville</span>
                        <span class="text-[9px] tracking-[0.25em] uppercase opacity-60">Studio</span>
                    </div>
                </div>
            </div>

            <div class="w-1/3 flex justify-end gap-16 pointer-events-auto">
                <span class="opacity-80">01</span>
                <button class="uppercase hover:opacity-60 transition-opacity">Work</button>
                <button class="uppercase hover:opacity-60 transition-opacity flex items-center gap-2">
                    Menu <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12"></line>
                        <line x1="4" x2="20" y1="6" y2="6"></line>
                        <line x1="4" x2="20" y1="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main id="slides-container" class="relative w-full h-full perspective-1000 flex items-center justify-center" style="perspective: 1200px;">
            <!-- Slides will be rendered here -->
        </main>

        <!-- Footer -->
        <footer id="footer" class="fixed bottom-0 left-0 w-full z-50 text-[#F2E8DC] mix-blend-difference pointer-events-none">
            <div class="px-6 md:px-12 pb-6 flex justify-between items-end font-mono text-[10px] md:text-xs tracking-widest uppercase">
                <a href="#" class="opacity-80 hover:opacity-100 transition-opacity pointer-events-auto">@radavillestudio</a>
                <div class="flex items-center gap-2 opacity-80">
                    <span id="current-location">Düsseldorf Germany</span>
                </div>
            </div>
            
            <div class="w-full h-3 md:h-4 border-t border-white/20 flex justify-between items-end overflow-hidden px-2">
                <!-- Grid lines -->
                <div id="grid-lines" class="flex w-full justify-between items-end"></div>
            </div>
        </footer>

        <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none mix-blend-difference z-[200] hidden md:block">
            <div class="w-1.5 h-1.5 bg-white rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)]"></div>
        </div>
    </div>

    <script>
        // --- Types & Constants ---
        const SLIDES = [
            {
                id: 1,
                titleLine1: "Hagi's",
                titleLine2: "Oldtown",
                location: "Düsseldorf Germany",
                image: "https://images.unsplash.com/photo-1616047006789-b7af5afb8c20?q=80&w=2080&auto=format&fit=crop", 
                themeColor: "#542e23", 
                textColor: "text-[#E8DCC5]",
                rotation: -3,
                xOffset: 0,
                yOffset: 0
            },
            {
                id: 2,
                titleLine1: "Hagi's",
                titleLine2: "Downtown",
                location: "Berlin Germany",
                image: "https://images.unsplash.com/photo-1549488497-606d0481232c?q=80&w=2070&auto=format&fit=crop", 
                themeColor: "#964B35", 
                textColor: "text-[#E8DCC5]",
                rotation: 4,
                xOffset: 20,
                yOffset: -10
            },
            {
                id: 3,
                titleLine1: "Casa",
                titleLine2: "Paz.",
                location: "Madrid Spain",
                image: "https://images.unsplash.com/photo-1584622050111-993a426fbf0a?q=80&w=2070&auto=format&fit=crop", 
                themeColor: "#421216", 
                textColor: "text-[#F2E8DC]",
                rotation: -2,
                xOffset: -15,
                yOffset: 5
            }
        ];

        // --- Utilities ---
        const hexToRgb = (hex) => {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        };

        const interpolateColor = (c1, c2, factor) => {
            const rgb1 = hexToRgb(c1);
            const rgb2 = hexToRgb(c2);
            if (!rgb1 || !rgb2) return c1;
            
            const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * factor);
            const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * factor);
            const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * factor);
            
            return `rgb(${r}, ${g}, ${b})`;
        };

        // --- Virtual Scroll ---
        class VirtualScroll {
            constructor(totalSlides) {
                this.totalSlides = totalSlides;
                this.scrollY = 0;
                this.targetScrollY = 0;
                this.currentScrollY = 0;
                this.isDragging = false;
                this.startY = 0;
                this.callbacks = [];
                
                this.init();
            }

            init() {
                const handleWheel = (e) => {
                    e.preventDefault();
                    const delta = e.deltaY * 0.0025;
                    this.targetScrollY += delta;
                    this.targetScrollY = Math.min(Math.max(this.targetScrollY, 0), this.totalSlides - 1);
                };

                const handleTouchStart = (e) => {
                    this.isDragging = true;
                    this.startY = e.touches[0].clientY;
                };

                const handleTouchMove = (e) => {
                    if (!this.isDragging) return;
                    const currentY = e.touches[0].clientY;
                    const delta = (this.startY - currentY) * 0.004;
                    this.targetScrollY += delta;
                    this.targetScrollY = Math.min(Math.max(this.targetScrollY, 0), this.totalSlides - 1);
                    this.startY = currentY;
                };

                const handleTouchEnd = () => {
                    this.isDragging = false;
                };

                window.addEventListener('wheel', handleWheel, { passive: false });
                window.addEventListener('touchstart', handleTouchStart, { passive: true });
                window.addEventListener('touchmove', handleTouchMove, { passive: false });
                window.addEventListener('touchend', handleTouchEnd);

                this.animate();
            }

            animate() {
                const diff = this.targetScrollY - this.currentScrollY;
                this.currentScrollY += diff * 0.08;
                this.scrollY = this.currentScrollY;
                
                this.callbacks.forEach(callback => callback(this.scrollY));
                
                requestAnimationFrame(() => this.animate());
            }

            onScroll(callback) {
                this.callbacks.push(callback);
            }
        }

        // --- Slide Component ---
        class Slide {
            constructor(data, index, container) {
                this.data = data;
                this.index = index;
                this.container = container;
                this.element = this.createSlideElement();
                this.container.appendChild(this.element);
            }

            createSlideElement() {
                const slide = document.createElement('div');
                slide.className = 'absolute inset-0 w-full h-full flex items-center justify-center pointer-events-none';
                slide.style.transformStyle = 'preserve-3d';
                
                const imageCard = document.createElement('div');
                imageCard.className = 'relative w-[85vw] md:w-[70vw] h-[55vh] md:h-[65vh] overflow-hidden shadow-2xl origin-center bg-black/20 group slide-content';
                
                const imageContainer = document.createElement('div');
                imageContainer.className = 'absolute -inset-y-12 inset-x-0 will-change-transform';
                
                const image = document.createElement('img');
                image.src = this.data.image;
                image.alt = `${this.data.titleLine1} ${this.data.titleLine2}`;
                image.className = 'w-full h-full object-cover slide-image';
                
                // Add loaded class when image is fully loaded
                image.onload = () => {
                    image.classList.add('loaded');
                };
                
                const grainOverlay = document.createElement('div');
                grainOverlay.className = 'absolute inset-0 opacity-[0.05] mix-blend-overlay';
                grainOverlay.style.backgroundImage = 'url("data:image/svg+xml,%3Csvg viewBox=%270 0 200 200%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27noiseFilter%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.65%27 numOctaves=%273%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23noiseFilter)%27/%3E%3C/svg%3E")';
                
                const enhancedOverlay = document.createElement('div');
                enhancedOverlay.className = 'absolute inset-0 slide-overlay';
                
                imageContainer.appendChild(image);
                imageContainer.appendChild(grainOverlay);
                imageContainer.appendChild(enhancedOverlay);
                
                // Decorative lines with enhanced styling
                const leftLine = document.createElement('div');
                leftLine.className = 'absolute top-0 left-12 w-[1px] h-full bg-white/20';
                leftLine.style.opacity = '0.6';
                
                const rightLine = document.createElement('div');
                rightLine.className = 'absolute top-0 right-12 w-[1px] h-full bg-white/20';
                rightLine.style.opacity = '0.6';
                
                const topLine = document.createElement('div');
                topLine.className = 'absolute top-12 left-0 w-full h-[1px] bg-white/20';
                topLine.style.opacity = '0.6';
                
                const bottomLine = document.createElement('div');
                bottomLine.className = 'absolute bottom-12 left-0 w-full h-[1px] bg-white/20';
                bottomLine.style.opacity = '0.6';
                
                const shadowOverlay = document.createElement('div');
                shadowOverlay.className = 'absolute inset-0 shadow-[inset_0_0_100px_rgba(0,0,0,0.3)]';
                shadowOverlay.style.background = 'linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.4) 100%)';
                
                imageCard.appendChild(imageContainer);
                imageCard.appendChild(leftLine);
                imageCard.appendChild(rightLine);
                imageCard.appendChild(topLine);
                imageCard.appendChild(bottomLine);
                imageCard.appendChild(shadowOverlay);
                
                // Typography with enhanced styling
                const typography = document.createElement('div');
                typography.className = 'absolute inset-0 flex flex-col items-center justify-center z-30 mix-blend-hard-light';
                typography.style.transform = 'translateZ(20px)';
                
                const titleContainer = document.createElement('div');
                titleContainer.className = 'flex flex-col items-center text-shadow';
                
                const titleLine1 = document.createElement('span');
                titleLine1.className = `font-serif italic text-4xl md:text-6xl lg:text-7xl mb-[-0.2em] md:mb-[-0.1em] ${this.data.textColor}`;
                titleLine1.textContent = this.data.titleLine1;
                
                const titleLine2 = document.createElement('h2');
                titleLine2.className = `font-serif text-6xl md:text-8xl lg:text-9xl tracking-tight ${this.data.textColor}`;
                titleLine2.textContent = this.data.titleLine2;
                
                titleContainer.appendChild(titleLine1);
                titleContainer.appendChild(titleLine2);
                typography.appendChild(titleContainer);
                
                slide.appendChild(imageCard);
                slide.appendChild(typography);
                
                return slide;
            }

            update(currentScrollY) {
                const relativePos = currentScrollY - this.index;
                
                let translateY = 0;
                let rotate = this.data.rotation;
                let scale = 1;
                let brightness = 1;
                let opacity = 1;
                let translateX = this.data.xOffset;
                let translateZ = 0;

                if (relativePos < 0) {
                    // WAITING in the pile
                    const depth = Math.abs(relativePos);
                    scale = Math.max(0.8, 1 - (depth * 0.05));
                    brightness = Math.max(0.6, 1 - (depth * 0.25));
                    opacity = Math.max(0.8, 1 - (depth * 0.1));
                    translateZ = -depth * 50;
                } else {
                    // LEAVING (Peeling off)
                    translateY = relativePos * -120;
                    rotate = this.data.rotation - (relativePos * 10);
                    brightness = 1 - (relativePos * 0.2);
                    opacity = 1 - (relativePos * 0.3);
                    translateZ = relativePos * 100;
                }

                const totalTranslateY = translateY + this.data.yOffset;
                const imageParallax = relativePos * 30;
                
                // Update slide transform with enhanced properties
                this.element.style.zIndex = 50 - this.index;
                this.element.style.transform = `translate3d(${translateX}px, ${totalTranslateY}%, ${translateZ}px) rotate(${rotate}deg) scale(${scale})`;
                this.element.style.filter = `brightness(${brightness}) saturate(${1 - Math.abs(relativePos) * 0.1})`;
                this.element.style.opacity = opacity;
                this.element.style.transformStyle = 'preserve-3d';
                this.element.style.willChange = 'transform, opacity, filter';
                
                // Update image parallax
                const imageContainer = this.element.querySelector('.absolute.-inset-y-12');
                if (imageContainer) {
                    imageContainer.style.transform = `translate3d(0, ${imageParallax}%, 0) scale(1.1)`;
                }
            }
        }

        // --- Main App ---
        class App {
            constructor() {
                this.slides = [];
                this.virtualScroll = new VirtualScroll(SLIDES.length);
                this.init();
            }

            init() {
                this.createGridLines();
                this.createSlides();
                this.setupEventListeners();
            }

            createGridLines() {
                const gridLinesContainer = document.getElementById('grid-lines');
                for (let i = 0; i < 120; i++) {
                    const line = document.createElement('div');
                    let heightClass = '';
                    if (i % 10 === 0) {
                        heightClass = 'h-full';
                    } else if (i % 5 === 0) {
                        heightClass = 'h-2 md:h-2.5';
                    } else {
                        heightClass = 'h-1 md:h-1.5';
                    }
                    line.className = `w-[1px] bg-white/40 ${heightClass}`;
                    gridLinesContainer.appendChild(line);
                }
            }

            createSlides() {
                const container = document.getElementById('slides-container');
                this.slides = SLIDES.map((slideData, index) => new Slide(slideData, index, container));
            }

            setupEventListeners() {
                this.virtualScroll.onScroll((scrollY) => {
                    this.updateSlides(scrollY);
                    this.updateUI(scrollY);
                    this.updateBackground(scrollY);
                });
            }

            updateSlides(scrollY) {
                this.slides.forEach(slide => {
                    slide.update(scrollY);
                });
            }

            updateUI(scrollY) {
                const activeIndex = Math.round(scrollY);
                const currentSlide = SLIDES[Math.min(activeIndex, SLIDES.length - 1)];
                const progress = scrollY / (SLIDES.length - 1);
                
                // Update progress
                const formattedProgress = Math.min(Math.round(progress * 100), 100).toString().padStart(2, '0');
                document.getElementById('progress').textContent = `[ ${formattedProgress} ]`;
                
                // Update slide counter
                document.getElementById('slide-counter').textContent = `${activeIndex + 1} &mdash; ${SLIDES.length}`;
                
                // Update title
                document.getElementById('current-title').textContent = `${currentSlide.titleLine1} ${currentSlide.titleLine2}`;
                
                // Update location
                document.getElementById('current-location').textContent = currentSlide.location;
            }

            updateBackground(scrollY) {
                const currentIndex = Math.floor(scrollY);
                const nextIndex = Math.min(currentIndex + 1, SLIDES.length - 1);
                const transitionFactor = scrollY - currentIndex;
                
                const currentColor = SLIDES[Math.min(currentIndex, SLIDES.length - 1)].themeColor;
                const nextColor = SLIDES[nextIndex].themeColor;
                
                const backgroundColor = interpolateColor(currentColor, nextColor, transitionFactor);
                document.getElementById('background').style.backgroundColor = backgroundColor;
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            new App();
        });
    </script>
</body>
</html>
